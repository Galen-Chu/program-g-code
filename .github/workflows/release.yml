name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate scripts before release
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
        ERRORS=0
        for script in $(find scripts/ -name "*.sh" -type f); do
          if ! shellcheck -x -S error "$script"; then
            ERRORS=$((ERRORS + 1))
          fi
        done
        if [ "$ERRORS" -gt 0 ]; then
          echo "::error::$ERRORS script(s) failed ShellCheck"
          exit 1
        fi
        echo "All scripts pass ShellCheck — safe to release"

    - name: Package toolkit
      run: |
        mkdir -p dist
        tar -czf dist/program-g-code-${GITHUB_REF#refs/tags/}.tar.gz \
          scripts/ config/ examples/ docs/ README.md LICENSE
        zip -r dist/program-g-code-${GITHUB_REF#refs/tags/}.zip \
          scripts/ config/ examples/ docs/ README.md LICENSE

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
