name: "CD (Simulation)"

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to simulate'
        required: true
        default: 'dev'
        type: choice
        options: [ dev, staging, prod ]
      dry_run:
        description: 'Dry run mode'
        required: false
        default: true
        type: boolean

env:
  DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
  TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  # ============================================================
  # Hard gate: verify toolkit scripts are syntactically valid
  # before simulating the pipeline.
  # ============================================================
  validate-scripts:
    name: "Validate Scripts"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Syntax check all scripts
      run: |
        ERRORS=0
        for script in $(find scripts/ -name "*.sh" -type f); do
          if ! bash -n "$script"; then
            echo "::error::Syntax error in $script"
            ERRORS=$((ERRORS + 1))
          fi
        done
        [ "$ERRORS" -eq 0 ] && echo "All scripts pass syntax check" || exit 1

  # ============================================================
  # Simulations: informational (continue-on-error) — these prove
  # the toolkit's pipeline scripts work in dry-run mode but may
  # need project-specific configuration to succeed.
  # ============================================================
  simulate-build:
    name: "Simulate: Build"
    runs-on: ubuntu-latest
    needs: validate-scripts
    continue-on-error: true
    strategy:
      matrix:
        example: [ simple-nodejs, simple-python ]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run toolkit build.sh (dry-run)
      run: |
        chmod +x scripts/*/*.sh
        DRY_RUN=true bash scripts/cd/build.sh --dry-run --config config/ci-cd.conf
      env:
        LOG_LEVEL: info
        BUILD_TOOL: auto

  simulate-deploy:
    name: "Simulate: Deploy"
    runs-on: ubuntu-latest
    needs: validate-scripts
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run toolkit deploy.sh (dry-run)
      run: |
        chmod +x scripts/*/*.sh
        DRY_RUN=true bash scripts/cd/deploy.sh ${{ env.TARGET_ENV }} --dry-run --skip-health --config config/ci-cd.conf
      env:
        LOG_LEVEL: info
        ENVIRONMENTS: dev,staging,prod

  simulate-rollback:
    name: "Simulate: Rollback"
    runs-on: ubuntu-latest
    needs: validate-scripts
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run toolkit rollback.sh (list)
      run: |
        chmod +x scripts/*/*.sh
        DRY_RUN=true bash scripts/cd/rollback.sh ${{ env.TARGET_ENV }} --list --config config/ci-cd.conf
      env:
        LOG_LEVEL: info

  simulate-health-check:
    name: "Simulate: Health Check"
    runs-on: ubuntu-latest
    needs: validate-scripts
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start mock server
      run: |
        python3 -c "
        import http.server, threading
        server = http.server.HTTPServer(('localhost', 18080), http.server.SimpleHTTPRequestHandler)
        t = threading.Thread(target=server.serve_forever, daemon=True)
        t.start()
        import time; time.sleep(120)
        " &
        sleep 2

    - name: Run health-check.sh (HTTP)
      run: |
        chmod +x scripts/*/*.sh
        bash scripts/utils/health-check.sh http://localhost:18080/ --retry 3 --interval 2

    - name: Run health-check.sh (TCP)
      run: |
        bash scripts/utils/health-check.sh --tcp localhost:18080 --retry 3 --interval 2

  simulate-notification:
    name: "Simulate: Notification"
    runs-on: ubuntu-latest
    needs: validate-scripts
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run notifiers.sh (webhook dry-run)
      run: |
        chmod +x scripts/*/*.sh
        DRY_RUN=true bash scripts/utils/notifiers.sh webhook "CD simulation completed" --url http://localhost:19999/hook
      env:
        LOG_LEVEL: info

  # ============================================================
  # Pipeline summary
  # ============================================================
  cd-summary:
    name: "CD Simulation Summary"
    runs-on: ubuntu-latest
    needs: [validate-scripts, simulate-build, simulate-deploy, simulate-rollback, simulate-health-check, simulate-notification]
    if: always()
    steps:
    - name: Report results
      run: |
        echo "## CD Pipeline Simulation Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Script Validation | ${{ needs.validate-scripts.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build Simulation | ${{ needs.simulate-build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Deploy Simulation | ${{ needs.simulate-deploy.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Rollback Simulation | ${{ needs.simulate-rollback.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Health Check | ${{ needs.simulate-health-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Notification | ${{ needs.simulate-notification.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Target**: ${{ env.TARGET_ENV }} / **Dry-run**: ${{ env.DRY_RUN }}" >> $GITHUB_STEP_SUMMARY
