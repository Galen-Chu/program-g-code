name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 06:17 UTC Monday（離開整點，避開 GitHub Actions 排程尖峰）
    - cron: '17 6 * * 1'

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for hardcoded secrets
      run: |
        # Pattern-based secret detection (aligned with the family-wide
        # guard list: classic + fine-grained GitHub PATs, cloud keys,
        # Slack tokens, Google API keys, private key blocks)
        PATTERNS=(
          "AKIA[0-9A-Z]{16}"
          "ghp_[a-zA-Z0-9]{36}"
          "github_pat_[a-zA-Z0-9_]{22,}"
          "gho_[a-zA-Z0-9]{36}"
          "sk-[a-zA-Z0-9_-]{20,}"
          "xox[baprs]-[a-zA-Z0-9-]+"
          "AIza[0-9A-Za-z_-]{35}"
          "glpat-[a-zA-Z0-9_-]{20,}"
          "hooks\.slack\.com/services"
          "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
        )
        FOUND=0
        for pattern in "${PATTERNS[@]}"; do
          if grep -rE "$pattern" scripts/ config/ --include="*.sh" --include="*.conf" 2>/dev/null; then
            echo "::error::Potential secret found matching pattern: $pattern"
            FOUND=$((FOUND + 1))
          fi
        done
        if [ "$FOUND" -gt 0 ]; then
          exit 1
        fi
        echo "No hardcoded secrets detected"

    - name: Check file permissions
      run: |
        # Ensure config files are not world-writable
        for f in config/*.conf; do
          perms=$(stat -c "%a" "$f")
          if [ "$((perms % 10))" -ge 2 ]; then
            echo "::warning::$f is world-writable (perms: $perms)"
          fi
        done
        echo "File permission check complete"

    - name: ShellCheck security rules
      run: |
        # Fail on any error-severity finding across all scripts.
        # (The previous version grepped for "^Error" in shellcheck's
        # human-readable output, which never matched — the gate could
        # not fail. This one checks shellcheck's own exit code.)
        sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
        ERRORS=0
        while IFS= read -r -d '' script; do
          if ! shellcheck -x -S error -s bash "$script"; then
            echo "::error::ShellCheck error-severity finding in $script"
            ERRORS=$((ERRORS + 1))
          fi
        done < <(find scripts/ -name "*.sh" -type f -print0)
        if [ "$ERRORS" -gt 0 ]; then
          exit 1
        fi
        echo "ShellCheck security rules passed"
