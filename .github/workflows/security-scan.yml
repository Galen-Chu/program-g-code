name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for hardcoded secrets
      run: |
        # Simple pattern-based secret detection
        PATTERNS=(
          "AKIA[0-9A-Z]{16}"
          "ghp_[a-zA-Z0-9]{36}"
          "gho_[a-zA-Z0-9]{36}"
          "sk-[a-zA-Z0-9]{48}"
          "xox[baprs]-[a-zA-Z0-9-]+"
          "hooks\.slack\.com/services"
        )
        FOUND=0
        for pattern in "${PATTERNS[@]}"; do
          if grep -r "$pattern" scripts/ config/ --include="*.sh" --include="*.conf" 2>/dev/null; then
            echo "::error::Potential secret found matching pattern: $pattern"
            FOUND=$((FOUND + 1))
          fi
        done
        if [ "$FOUND" -gt 0 ]; then
          exit 1
        fi
        echo "No hardcoded secrets detected"

    - name: Check file permissions
      run: |
        # Ensure config files are not world-writable
        for f in config/*.conf; do
          perms=$(stat -c "%a" "$f")
          if [ "$((perms % 10))" -ge 2 ]; then
            echo "::warning::$f is world-writable (perms: $perms)"
          fi
        done
        echo "File permission check complete"

    - name: ShellCheck security rules
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
        ERRORS=0
        for script in scripts/**/*.sh; do
          if ! shellcheck -x -S error -s bash "$script" 2>&1 | grep -q "SC2148\|SC2086\|SC2164\|SC2116"; then
            continue  # No security-relevant issues
          fi
          if shellcheck -x -S error "$script" 2>&1 | grep -q "^Error"; then
            echo "::error::Security issue in $script"
            ERRORS=$((ERRORS + 1))
          fi
        done
        if [ "$ERRORS" -gt 0 ]; then
          exit 1
        fi
        echo "ShellCheck security rules passed"
