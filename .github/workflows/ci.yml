name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  TOOLKIT_DIR: ${{ github.workspace }}

jobs:
  # ============================================================
  # Self-test: use the toolkit's OWN lint script on its OWN
  # example projects — proves the auto-detection works.
  # ============================================================
  self-test-lint-nodejs:
    name: Self-Test: Lint Node.js Example
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install example dependencies
      working-directory: examples/simple-nodejs
      run: npm install

    - name: Run toolkit's lint script (auto-detects Node.js)
      working-directory: examples/simple-nodejs
      run: |
        chmod +x ../../scripts/**/*.sh
        bash ../../scripts/ci/lint.sh
      env:
        LOG_LEVEL: debug

  self-test-lint-python:
    name: Self-Test: Lint Python Example
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install flake8 for example
      run: pip install flake8

    - name: Run toolkit's lint script (auto-detects Python)
      working-directory: examples/simple-python
      run: |
        chmod +x ../../scripts/**/*.sh
        bash ../../scripts/ci/lint.sh
      env:
        LOG_LEVEL: debug

  # ============================================================
  # Self-test: use the toolkit's OWN test script on its OWN
  # example projects — proves the test runner detection works.
  # ============================================================
  self-test-nodejs:
    name: Self-Test: Test Node.js Example
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install example dependencies
      working-directory: examples/simple-nodejs
      run: npm install

    - name: Run toolkit's test script (auto-detects Jest)
      working-directory: examples/simple-nodejs
      run: |
        chmod +x ../../scripts/**/*.sh
        bash ../../scripts/ci/test.sh
      env:
        LOG_LEVEL: info

  self-test-python:
    name: Self-Test: Test Python Example
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install example dependencies
      working-directory: examples/simple-python
      run: pip install -r requirements.txt

    - name: Run toolkit's test script (auto-detects pytest)
      working-directory: examples/simple-python
      run: |
        chmod +x ../../scripts/**/*.sh
        bash ../../scripts/ci/test.sh
      env:
        LOG_LEVEL: info

  # ============================================================
  # Pre-flight: run the toolkit's own pre-flight checks
  # against the toolkit repo itself.
  # ============================================================
  self-test-preflight:
    name: Self-Test: Pre-flight Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run toolkit's pre-flight script on itself
      run: |
        chmod +x scripts/**/*.sh
        bash scripts/utils/pre-flight.sh --quick --skip-docs
      env:
        LOG_LEVEL: info

  # ============================================================
  # Doc-check: validate documentation completeness
  # ============================================================
  self-test-doccheck:
    name: Self-Test: Documentation Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run toolkit's doc-check script
      run: |
        chmod +x scripts/**/*.sh
        bash scripts/utils/doc-check.sh --required-only
      env:
        LOG_LEVEL: info

  # ============================================================
  # ShellCheck: lint the toolkit's own shell scripts
  # ============================================================
  shell-lint:
    name: ShellCheck Toolkit Scripts
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install ShellCheck
      run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

    - name: Run ShellCheck
      run: |
        ERRORS=0
        for script in $(find scripts/ -name "*.sh" -type f); do
          if ! shellcheck -x -S warning "$script" 2>&1; then
            ERRORS=$((ERRORS + 1))
          fi
        done
        if [ "$ERRORS" -gt 0 ]; then
          echo "::error::$ERRORS shell script(s) failed ShellCheck"
          exit 1
        fi
        echo "All shell scripts pass ShellCheck"

  # ============================================================
  # Config validation: ensure ci-cd.conf is parseable and
  # the structure check finds all expected files.
  # ============================================================
  config-validate:
    name: Config & Structure Validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate config file exists and is parseable
      run: |
        if [ ! -f config/ci-cd.conf ]; then
          echo "::error::config/ci-cd.conf not found"
          exit 1
        fi
        # Check it has expected sections
        for section in general ci cd notifications; do
          if ! grep -q "^\[$section\]" config/ci-cd.conf; then
            echo "::error::Missing [$section] section in config"
            exit 1
          fi
        done
        echo "Config file valid"

    - name: Verify directory structure
      run: |
        EXPECTED=(
          "scripts/ci/lint.sh" "scripts/ci/test.sh" "scripts/ci/coverage.sh"
          "scripts/cd/build.sh" "scripts/cd/deploy.sh" "scripts/cd/rollback.sh"
          "scripts/setup/init-project.sh" "scripts/setup/install-deps.sh"
          "scripts/utils/common.sh" "scripts/utils/logger.sh"
          "scripts/utils/validators.sh" "scripts/utils/notifiers.sh"
          "scripts/utils/health-check.sh" "scripts/utils/status-check.sh"
          "scripts/utils/doc-check.sh" "scripts/utils/pre-flight.sh"
          "scripts/utils/update-changelog.sh"
          "config/ci-cd.conf"
        )
        MISSING=0
        for f in "${EXPECTED[@]}"; do
          if [ ! -f "$f" ]; then
            echo "::error::Missing: $f"
            MISSING=$((MISSING + 1))
          fi
        done
        [ "$MISSING" -eq 0 ] && echo "All ${#EXPECTED[@]} expected files present" || exit 1
