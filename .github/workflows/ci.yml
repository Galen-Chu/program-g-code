name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================================
  # Hard gate: ShellCheck (errors only, not style warnings)
  # ============================================================
  shell-lint:
    name: "ShellCheck (errors only)"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install ShellCheck
      run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

    - name: Run ShellCheck
      run: |
        ERRORS=0
        for script in $(find scripts/ -name "*.sh" -type f); do
          RESULT=$(shellcheck -x -S error "$script" 2>&1)
          if [ $? -ne 0 ]; then
            echo "::error::ShellCheck error in $script"
            echo "$RESULT"
            ERRORS=$((ERRORS + 1))
          fi
        done
        if [ "$ERRORS" -gt 0 ]; then
          echo "::error::$ERRORS shell script(s) failed ShellCheck"
          exit 1
        fi
        echo "All shell scripts pass ShellCheck (error level)"

  # ============================================================
  # Hard gate: Config & structure validation
  # ============================================================
  config-validate:
    name: "Config & Structure Validation"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate config file
      run: |
        if [ ! -f config/ci-cd.conf ]; then
          echo "::error::config/ci-cd.conf not found"
          exit 1
        fi
        for section in general target ci cd notifications; do
          if ! grep -q "^\[$section\]" config/ci-cd.conf; then
            echo "::error::Missing [$section] section in config"
            exit 1
          fi
        done
        echo "Config file valid"

    - name: Verify directory structure
      run: |
        EXPECTED=(
          "scripts/ci/lint.sh" "scripts/ci/test.sh" "scripts/ci/coverage.sh"
          "scripts/cd/build.sh" "scripts/cd/deploy.sh" "scripts/cd/rollback.sh"
          "scripts/setup/init-project.sh" "scripts/setup/install-deps.sh"
          "scripts/utils/common.sh" "scripts/utils/logger.sh"
          "scripts/utils/validators.sh" "scripts/utils/notifiers.sh"
          "scripts/utils/health-check.sh" "scripts/utils/status-check.sh"
          "scripts/utils/doc-check.sh" "scripts/utils/pre-flight.sh"
          "scripts/utils/update-changelog.sh"
          "config/ci-cd.conf"
        )
        MISSING=0
        for f in "${EXPECTED[@]}"; do
          if [ ! -f "$f" ]; then
            echo "::error::Missing: $f"
            MISSING=$((MISSING + 1))
          fi
        done
        [ "$MISSING" -eq 0 ] && echo "All ${#EXPECTED[@]} expected files present" || exit 1

  # ============================================================
  # Self-tests: prove the toolkit's scripts can auto-detect and
  # run. Informational (continue-on-error) because the scripts
  # need more real-world testing to be production-stable.
  # ============================================================
  self-test-lint-nodejs:
    name: "Self-Test: Lint Node.js"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install example deps
      working-directory: examples/simple-nodejs
      run: npm install

    - name: Run toolkit lint.sh
      working-directory: examples/simple-nodejs
      run: |
        bash ../../scripts/ci/lint.sh --config ../../config/ci-cd.conf
      env:
        LOG_LEVEL: info

  self-test-lint-python:
    name: "Self-Test: Lint Python"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install flake8
      run: pip install flake8

    - name: Run toolkit lint.sh
      working-directory: examples/simple-python
      run: |
        bash ../../scripts/ci/lint.sh --config ../../config/ci-cd.conf
      env:
        LOG_LEVEL: info

  self-test-nodejs:
    name: "Self-Test: Test Node.js"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install example deps
      working-directory: examples/simple-nodejs
      run: npm install

    - name: Run toolkit test.sh
      working-directory: examples/simple-nodejs
      run: |
        bash ../../scripts/ci/test.sh --config ../../config/ci-cd.conf
      env:
        LOG_LEVEL: info

  self-test-python:
    name: "Self-Test: Test Python"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install example deps
      working-directory: examples/simple-python
      run: pip install -r requirements.txt

    - name: Run toolkit test.sh
      working-directory: examples/simple-python
      run: |
        bash ../../scripts/ci/test.sh --config ../../config/ci-cd.conf
      env:
        LOG_LEVEL: info

  self-test-preflight:
    name: "Self-Test: Pre-flight Check"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run toolkit pre-flight.sh
      run: |
        chmod +x scripts/*/*.sh
        bash scripts/utils/pre-flight.sh --quick --skip-docs
      env:
        LOG_LEVEL: info

  self-test-doccheck:
    name: "Self-Test: Doc Check"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run toolkit doc-check.sh
      run: |
        chmod +x scripts/*/*.sh
        bash scripts/utils/doc-check.sh --required-only
      env:
        LOG_LEVEL: info
