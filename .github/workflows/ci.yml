name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Lint shell scripts with ShellCheck
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install ShellCheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Run ShellCheck on all scripts
      run: |
        ERRORS=0
        for script in scripts/**/*.sh; do
          echo "Checking: $script"
          if ! shellcheck -x -S warning "$script"; then
            ERRORS=$((ERRORS + 1))
          fi
        done
        if [ "$ERRORS" -gt 0 ]; then
          echo "::error::$ERRORS shell script(s) failed ShellCheck"
          exit 1
        fi
        echo "All shell scripts pass ShellCheck"

  # Syntax-check all shell scripts
  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check bash syntax
      run: |
        ERRORS=0
        for script in $(find scripts/ -name "*.sh" -type f); do
          if ! bash -n "$script"; then
            echo "::error::Syntax error in $script"
            ERRORS=$((ERRORS + 1))
          fi
        done
        if [ "$ERRORS" -gt 0 ]; then
          exit 1
        fi
        echo "All shell scripts pass syntax check"

  # Verify scripts are executable and directory structure is complete
  structure:
    name: Structure Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify directory structure
      run: |
        EXPECTED=(
          "scripts/ci/lint.sh"
          "scripts/ci/test.sh"
          "scripts/ci/coverage.sh"
          "scripts/cd/build.sh"
          "scripts/cd/deploy.sh"
          "scripts/cd/rollback.sh"
          "scripts/setup/init-project.sh"
          "scripts/setup/install-deps.sh"
          "scripts/utils/common.sh"
          "scripts/utils/logger.sh"
          "scripts/utils/validators.sh"
          "scripts/utils/notifiers.sh"
          "scripts/utils/health-check.sh"
          "scripts/utils/status-check.sh"
          "scripts/utils/doc-check.sh"
          "scripts/utils/pre-flight.sh"
          "scripts/utils/update-changelog.sh"
          "config/ci-cd.conf"
        )
        MISSING=0
        for f in "${EXPECTED[@]}"; do
          if [ ! -f "$f" ]; then
            echo "::error::Missing: $f"
            MISSING=$((MISSING + 1))
          fi
        done
        if [ "$MISSING" -gt 0 ]; then
          echo "::error::$MISSING expected file(s) missing"
          exit 1
        fi
        echo "All ${#EXPECTED[@]} expected files present"

  # Test the Node.js example project
  test-nodejs:
    name: Test Node.js Example
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install and test
      working-directory: examples/simple-nodejs
      run: |
        npm install
        npm test

  # Test the Python example project
  test-python:
    name: Test Python Example
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install and test
      working-directory: examples/simple-python
      run: |
        pip install -r requirements.txt
        pytest -v
